format = '''
[┌─](bold green) $battery$directory
[](bold green)$username@$hostname$git_branch$git_commit$git_state$git_metrics$git_status
[└─ $time$character](bold green)'''

[directory]
fish_style_pwd_dir_length = 3   # 1 char per ancestor dir, full name for last segment
truncation_length = 4           # how many dirs deep to show

#[battery]
#format='[$symbol]($style)'

[[battery.display]]
threshold = 100
style = 'bold white'

[[battery.display]]
threshold = 50
style = 'bold yellow'

[[battery.display]]
threshold = 20
style = 'bold red'

[username]
style_user = 'white bold'
style_root = 'black bold'
format = '[$user]($style)'
disabled = false
show_always = true

[hostname]
ssh_only=false
format='[$ssh_symbol$hostname]($style) '

[time]
disabled=false
