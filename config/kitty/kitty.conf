# kitty config (linked to ~/.config/kitty/kitty.conf by scripts/06-kitty-mermaid.sh).
# Ported from your ~/.config/alacritty/alacritty.toml. kitty is needed because it can show
# images (kitty graphics protocol), which lets Neovim render ```mermaid blocks inline.

font_family      JetBrainsMono Nerd Font
font_size        11.0

# [window] opacity = 0.80, blur = true
background_opacity 1
background_blur    1

# [colors.primary] background / [colors.normal] black
background #11262B
color0     #11262B

# [[keyboard.bindings]] Shift+Enter -> ESC CR (newline in Claude Code and other TUIs)
map shift+enter send_text all \x1b\r

# quieter defaults
enable_audio_bell       no
confirm_os_window_close 0
