backend = "glx";
vsync = true;
corner-radius = 10.0;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
unredir-if-possible = false;
 
blur = {
  background = true;
  method = "dual_kawase";
  strength = 5;
  //method = "box",
  //size = 20;
}

blur-background-exclude = [
  "class_g = 'slop'",
    "class_g = 'Conky'",
    "name = 'Notification'",
    "_GTK_FRAME_EXTENTS@:c",
    # Exclude desktop/wallpaper
    "window_type = 'desktop'",
    "class_g = 'Plank'",
    #"class_g = 'Polybar'"
]

fading = true;
fade-delta=5

animations = (  
  {
    triggers = ["hide", "close"];
    #preset = "disappear";
    #scale = 0.8; 
    #preset = "geometry-change";
    preset = "slide-out";
    direction = "down";
    duration = 0.5;
  },
  {
    triggers = ["show", "open"];
    #preset = "appear";
    #scale = 0.8;
    preset = "slide-in";
    direction = "up";
    duration = 0.3;
  },
  {
    triggers = ["geometry", "open", "close"];
    preset = "geometry-change";
    duration = 0.3;
  }  

)

inactive-opacity = 0.85;
active-opacity = 0.85;
frame-opacity = 0.85;

opacity-rule = [
  "100:(class_g = 'zen' || class_g = 'osu!' || class_g = 'i3lock')",
  "88:(class_g = 'URxvt' || class_g = 'Alacritty' || class_g = 'Terminator' || class_g='gnome-text-editor' || class_g = 'kitty') && focused",
  "80:(class_g = 'URxvt' || class_g = 'Alacritty' || class_g = 'Terminator' || class_g = 'kitty') && !focused",
  "85:(class_g = 'Code' || class_g = 'Postman') && focused",
  "75:(class_g = 'Code' || class_g = 'gnome-text-editor' || class_g = 'Postman') && !focused",
  "30:(class_g = 'ffplay')",
  "75:(class_g = 'dunst')"
];

